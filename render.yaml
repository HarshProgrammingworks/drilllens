services:
  - type: web
    name: drilllens-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drilllens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: drilllens-db
    databaseName: drilllens
    user: drilllens
    plan: free
